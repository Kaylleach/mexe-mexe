<style>
/* Standalone page: what the Claude page skeleton used to provide, plus connection status. */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; -webkit-tap-highlight-color: transparent; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.netpill { margin: 0; display: inline-flex; align-items: center; gap: 8px; align-self: center; padding: 6px 14px; border-radius: 999px; background: var(--shade); font-size: 14px; font-weight: 700; }
.netpill i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.netpill.ok i { background: var(--ok); }
.netpill.warn { color: var(--bad); }
.netpill.warn i { background: var(--bad); }
.screen > .netpill, .wrap > .netpill { align-self: flex-start; }
.invite { display: flex; flex-direction: column; gap: 10px; }
a.btn { display: block; text-align: center; text-decoration: none; }
.btn.whatsapp { background: #25d366; color: #06301a; border-color: transparent; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--gold); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

<body>
<style>
:root {
  /* Layout: a card table. Felt surface, family seated along the top rim, shared melds in the middle, your hand in a wooden tray at the bottom. */
  --felt: #173a2d;
  --felt-hi: #21503d;
  --felt-lo: #0f271e;
  --rim: #6b4529;
  --chalk: #edf2ea;
  --muted: #a7c0b1;
  --gold: #f2c230;
  --gold-ink: #2a2105;
  --card: #fbf8f1;
  --ink: #1c1b19;
  --red: #b3261e;
  --bad: #ff8f80;
  --ok: #86dfa1;
  --shade: rgba(0, 0, 0, .2);
  --line: rgba(237, 242, 234, .22);
  --f-display: "Alegreya", Georgia, "Times New Roman", serif;
  --f-body: "Alegreya Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cw: 50px;
  color-scheme: dark;
}
@media (min-width: 720px) { :root { --cw: 62px; } }

*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--felt);
  background-image: radial-gradient(120% 90% at 50% 25%, var(--felt-hi), var(--felt) 55%, var(--felt-lo));
  background-attachment: fixed;
  color: var(--chalk);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
}
.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 100vh;
}

/* Segmented controls */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { font: 700 12px var(--f-body); letter-spacing: .8px; padding: 6px 10px; background: transparent; color: var(--muted); border: 0; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--chalk); color: var(--felt); }

/* Buttons */
.btn { font: 700 15px var(--f-body); padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--chalk); cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--chalk); }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: transparent; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
.btn.small { font-size: 13px; padding: 6px 12px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.status { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.turnline { font-family: var(--f-display); font-style: italic; font-weight: 700; font-size: 24px; margin: 0; text-wrap: balance; }
.turnline.mine { color: var(--gold); }
.deck { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.deck .back { width: 26px; height: 36px; border-radius: 4px; background: repeating-linear-gradient(45deg, #8e2f25 0 4px, #a8392d 4px 8px); border: 2px solid var(--card); box-shadow: 2px 2px 0 var(--card), 3px 3px 0 rgba(0,0,0,.3); }

/* Table */
.table { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 12px; min-height: 170px; padding: 14px; border-radius: 18px; background: rgba(0, 0, 0, .13); border: 1px solid rgba(255, 255, 255, .06); }
.table .empty { color: var(--muted); font-size: 15px; max-width: 46ch; margin: auto; text-align: center; }
.meld { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px 8px 8px; border-radius: 12px; background: var(--shade); border: 1.5px dashed transparent; min-width: 0; }
.meld.bad { border-color: var(--bad); }
.meld .tag { font-size: 12px; color: var(--bad); font-weight: 700; }
.meld .row { display: flex; padding-top: 6px; }
.meld .row .card + .card { margin-left: calc(var(--cw) * -0.48); transition: margin-left .12s ease, transform .12s ease, box-shadow .12s ease; }
/* A picked card slides its right-hand neighbour over so nothing gets covered. */
.meld .row .card.sel + .card { margin-left: 6px; }
.drop { font: 700 13px var(--f-body); padding: 6px 10px; border-radius: 8px; border: 1.5px dashed var(--gold); color: var(--gold); background: transparent; cursor: pointer; }
.drop:hover { background: rgba(242, 194, 48, .1); }
.newmeld { align-self: center; padding: 18px 14px; }

/* Cards */
.card {
  position: relative; flex: none;
  width: var(--cw); height: calc(var(--cw) * 1.4);
  border-radius: 6px; border: 1px solid rgba(0, 0, 0, .28);
  background: var(--card); color: var(--ink);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .4);
  padding: 0; cursor: pointer; font-family: var(--f-body);
  transition: transform .12s ease, box-shadow .12s ease;
}
.card .ix { position: absolute; top: 3px; left: 4px; display: flex; flex-direction: column; align-items: center; line-height: .95; font-weight: 800; font-size: calc(var(--cw) * .32); }
.card .ix i { font-style: normal; font-size: .85em; }
.card .pip { position: absolute; right: 5px; bottom: 2px; font-size: calc(var(--cw) * .52); line-height: 1; }
.card.red { color: var(--red); }
.card.fresh { box-shadow: 0 0 0 2px var(--ok), 0 1px 3px rgba(0, 0, 0, .4); }
.card.sel { transform: translateY(-7px); box-shadow: 0 0 0 3px var(--gold), 0 8px 14px rgba(0, 0, 0, .45); }
.card.static { cursor: default; }

/* Tray */
.tray {
  position: sticky; bottom: 0; z-index: 5;
  margin-top: auto;
  background: var(--felt-lo);
  border-top: 4px solid var(--rim);
  border-radius: 16px 16px 0 0;
  padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 8px;
  box-shadow: 0 -8px 24px rgba(0, 0, 0, .35);
}
.tray-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.label { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.hand { display: flex; gap: 6px; overflow-x: auto; padding: 10px 2px 6px; min-height: calc(var(--cw) * 1.4 + 16px); align-items: flex-end; }
.hand.target { outline: 1.5px dashed var(--gold); outline-offset: -2px; border-radius: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hint { font-size: 14px; color: var(--muted); margin: 0; }
.hint.warn { color: var(--bad); }
.linkbtn { font: 600 13px var(--f-body); background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 4px; }

/* Panels */
.panel { background: rgba(0, 0, 0, .22); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 560px; }
.panel h2 { font-family: var(--f-display); font-style: italic; font-weight: 800; font-size: 26px; margin: 0; color: var(--gold); text-wrap: balance; }
.panel p { margin: 0; }
.field { display: flex; gap: 8px; flex-wrap: wrap; }
.field input { flex: 1 1 200px; min-width: 0; font: 500 16px var(--f-body); padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(0, 0, 0, .25); color: var(--chalk); }
.field input::placeholder { color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; background: var(--shade); }
.list .score { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.note { font-size: 14px; color: var(--muted); }
.banner { font-family: var(--f-display); font-style: italic; font-weight: 800; font-size: 34px; color: var(--gold); margin: 0; text-wrap: balance; }

.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 14px; color: var(--muted); }
.log li:first-child { color: var(--chalk); }

details.rules { background: var(--shade); border-radius: 14px; padding: 10px 16px; }
details.rules summary { cursor: pointer; font-weight: 700; }
details.rules ul { margin: 10px 0 4px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; max-width: 70ch; }

.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); transform: translateX(-50%); z-index: 20; background: var(--chalk); color: var(--felt); font-weight: 700; padding: 10px 18px; border-radius: 999px; box-shadow: 0 6px 18px rgba(0, 0, 0, .4); max-width: calc(100% - 32px); text-align: center; }

/* Sand timer */
.sand { display: flex; align-items: center; gap: 10px; color: var(--chalk); font-weight: 700; font-variant-numeric: tabular-nums; }
.sand b { font-size: 18px; }
.sand.low { color: var(--bad); }
.sand svg.flip { animation: flip .6s ease; }
@keyframes flip { from { transform: rotate(-180deg); } to { transform: rotate(0); } }
.sandbar { flex: 1; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .12); overflow: hidden; }
.sandbar i { display: block; height: 100%; background: var(--gold); transition: width .25s linear; }
.sand.low .sandbar i { background: var(--bad); }
.timerctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* Scoreboard */
:root { --silver: #cfd7dc; --bronze: #c98b58; }
.board { display: flex; flex-direction: column; gap: 18px; }
.board-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.board-head > div:first-child { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.board-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 780px) { .board-grid { grid-template-columns: minmax(0, 1fr); } }
.board-grid .panel { max-width: none; }
.board-side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.tablewrap { overflow-x: auto; }
.ranktable { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.ranktable th { text-align: left; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 0 8px 8px; white-space: nowrap; }
.ranktable td { padding: 9px 8px; border-top: 1px solid rgba(237, 242, 234, .1); vertical-align: middle; }
.ranktable .num { text-align: right; }
.ranktable td:last-child { white-space: nowrap; }
.rank { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-weight: 800; font-size: 13px; color: var(--muted); border: 1.5px solid rgba(237, 242, 234, .25); flex: none; }
.rank.r1 { background: var(--gold); color: var(--gold-ink); border-color: transparent; }
.rank.r2 { background: var(--silver); color: #23292c; border-color: transparent; }
.rank.r3 { background: var(--bronze); color: #2b1a0c; border-color: transparent; }
.botsmall { font-size: 10px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
.ratebar { display: inline-block; width: 70px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .12); overflow: hidden; vertical-align: middle; margin-right: 8px; }
.ratebar i { display: block; height: 100%; background: var(--gold); }
.ratepct { font-size: 14px; color: var(--muted); }
@media (max-width: 480px) { .ratebar { display: none; } .ranktable th, .ranktable td { padding-inline: 5px; } }
.select { font: 600 16px var(--f-body); padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(0, 0, 0, .25); color: var(--chalk); max-width: 100%; }
.h2h { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.h2h-top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 15px; margin-bottom: 4px; }
.h2h-bar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.h2h-bar span { display: flex; align-items: center; padding: 0 8px; min-width: 26px; }
.h2h-bar .mine { background: var(--gold); color: var(--gold-ink); }
.h2h-bar .theirs { background: rgba(237, 242, 234, .2); color: var(--chalk); justify-content: flex-end; }
.recent { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.recent li { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-top: 1px solid rgba(237, 242, 234, .1); font-size: 15px; }
.recent li:first-child { border-top: 0; padding-top: 0; }
.recent .winner { color: var(--gold); }
.scorelist li { align-items: center; }
.scorelist .grow { flex: 1; }

/* Shared screen chrome: sticky top bar with back / title / settings */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--felt); }
.topbar, .hud {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6;
  display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px;
  padding-block: 8px; background: var(--felt);
  border-bottom: 1px solid rgba(237, 242, 234, .08);
}
.topbar { grid-template-columns: 44px minmax(0, 1fr) 44px; }
.topbar-title { margin: 0; text-align: center; font-family: var(--f-display); font-style: italic; font-weight: 800; font-size: 22px; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--chalk); display: grid; place-items: center; cursor: pointer; padding: 0; }
.iconbtn:hover { border-color: var(--chalk); }
.iconbtn.tiny { width: 28px; height: 28px; }
.iconbtn.tiny svg { width: 12px; height: 12px; }
.screen { display: flex; flex-direction: column; gap: 22px; padding-bottom: 8px; flex: 1; }

/* Home */
.home { flex: 1; display: flex; flex-direction: column; }
.home-top { display: flex; justify-content: flex-end; }
.home-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding-block: 12px 40px; }
.logo { font-family: var(--f-display); font-style: italic; font-weight: 800; font-size: clamp(52px, 11vw, 88px); line-height: .95; color: var(--gold); margin: 0; letter-spacing: -.5px; }
.home-main .tagline { font-size: 17px; margin: 0; max-width: 34ch; color: var(--muted); }
.home-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; margin-top: 10px; }
.pill { margin: 0; padding: 6px 14px; border-radius: 999px; background: var(--shade); font-size: 14px; font-weight: 700; }
.pill.mine { background: var(--gold); color: var(--gold-ink); }
.pill.quiet { font-weight: 500; color: var(--muted); }
.fan { position: relative; height: calc(var(--cw) * 1.4 + 34px); width: calc(var(--cw) * 4.2); }
.fan-card { position: absolute; bottom: 0; left: calc(50% - var(--cw) / 2 + var(--i) * var(--cw) * .45); transform: rotate(calc(var(--i) * 10deg)); transform-origin: 50% 130%; }
.fan-card .card { box-shadow: 0 6px 14px rgba(0, 0, 0, .35); }
.btn.big { width: 100%; font-size: 17px; padding: 14px 20px; }
/* Someone left the table */
.pchip.away { opacity: .6; }
.awaytag { color: var(--bad); font-size: 11px; letter-spacing: .6px; text-transform: uppercase; font-weight: 800; }
.subtag { color: var(--muted); font-size: 11px; letter-spacing: .6px; text-transform: uppercase; }
.awaybanner { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--bad); background: rgba(255, 143, 128, .08); }
.awaybanner p { margin: 0; }
/* Invited guest: just the table and their name */
.screen.guest { padding-top: 12px; }
.logo.small { font-size: 44px; text-align: center; }
.screen.guest .netpill { align-self: center; }
.screen.guest .pill { align-self: center; text-align: center; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.danger:hover:not(:disabled) { background: rgba(255, 143, 128, .1); }

/* Sala: blocks, six seat slots, sticky start bar */
.block { display: flex; flex-direction: column; gap: 12px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.block-title { margin: 0; font-size: 13px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; }
.seatgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .seatgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.slot { position: relative; min-height: 128px; border-radius: 16px; padding: 16px 10px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; background: var(--shade); border: 1.5px solid transparent; min-width: 0; }
.slot.me { border-color: var(--gold); }
.slot .x { position: absolute; top: 6px; right: 6px; }
.slot-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot small { font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
.slot.empty { background: transparent; border: 1.5px dashed var(--line); color: var(--muted); font: 700 14px var(--f-body); }
button.slot.empty { cursor: pointer; }
button.slot.empty:hover { border-color: var(--gold); color: var(--gold); }
.slot .plus { font-size: 28px; line-height: 1; font-weight: 400; }
.avatar { width: 32px; height: 32px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: var(--gold-ink); font-weight: 800; font-size: 15px; }
.avatar.lg { width: 52px; height: 52px; font-size: 22px; }
.avatar.bot { background: transparent; color: var(--muted); border: 1.5px dashed var(--muted); }
.banner-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-radius: 12px; background: var(--shade); }
.startbar { position: sticky; bottom: 0; margin-top: auto; display: flex; flex-direction: column; gap: 6px; align-items: stretch; text-align: center; padding: 14px 0 calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to bottom, transparent, var(--felt-lo) 35%); }
.startbar .actions { justify-content: center; }

/* Partida: players around the table */
.hud .turnline { font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud .deck { gap: 8px; font-weight: 700; color: var(--chalk); }
.players { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.pchip { flex: none; display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 5px; border-radius: 999px; background: var(--shade); border: 2px solid transparent; font-size: 14px; }
.pchip.turn { border-color: var(--gold); }
.pchip.me .pname { font-weight: 700; }
.pname small { color: var(--muted); }
.pcount { min-width: 24px; height: 30px; padding: 0 5px; border-radius: 4px; display: grid; place-items: center; background: var(--card); color: var(--ink); font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; box-shadow: 1px 1px 0 rgba(0, 0, 0, .3); }

/* Popups: dimmed backdrop + sheet (bottom sheet on phones, centred card on wider screens) */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(4, 14, 9, .62); display: flex; align-items: center; justify-content: center; padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

      </table></div>
    </div>`;

    const who = rows.find((r) => r.k === vsKey) ? vsKey : rows.find((r) => r.k === myKey())?.k || rows.find((r) => !r.bot)?.k || rows[0].k;
    const h2h = headToHead(who);
    const whoNick = rows.find((r) => r.k === who)?.nick || "";
    body += `<div class="board-side"><div class="panel">
      <label class="label" for="vsWho">${t("vsTitle")}</label>
      <select id="vsWho" class="select">${rows.map((r) => `<option value="${esc(r.k)}" ${r.k === who ? "selected" : ""}>${esc(r.nick)}</option>`).join("")}</select>
      ${h2h.length ? `<ul class="h2h">${h2h.map((r) => `<li>
          <div class="h2h-top"><b>${esc(whoNick)} × ${esc(r.nick)}</b><span class="note">${t("together", { c: r.together })}</span></div>

    if (canWrite) body += askReset
      ? `<div class="actions"><span class="note">${t("resetAsk")}</span><button class="btn small" data-act="resetyes">${t("resetYes")}</button><button class="btn small" data-act="resetno">${t("endNo")}</button></div>`
      : `<button class="linkbtn" data-act="resetask">${t("reset")}</button>`;
    return body + `</section>`;
  }
  // ---------- sand timer ----------
  const TIMER_OPTIONS = [0, 30, 60, 90];
  const coverShowing = () => mode === "local" && game?.status === "playing" && revealedSeq !== game.seq && !game.players[game.turn].bot && humanCount() > 1;
  function timeLeft() {
    if (!game || game.status !== "playing" || !game.timer || game.players[game.turn].bot) return null;
    return game.timer - (Date.now() - clockStart) / 1000;
  }
  async function setTimer(sec) {
    try {
      await store.setSettings({ ...settings, timer: sec });
      if (game?.status === "playing") await store.updateGame({ timer: sec, timerAt: Date.now() });
    } catch (e) { toast(t("saveFail")); }
  }
  // Time's up: undo whatever was moved and draw, same as giving up (3 cards if the table was touched).
  function timeoutDraw() {
    const uid = game.players[game.turn].uid;
    const g = applyDraw(clone(game), uid);
    const e = g.log[0];
    if (e && (e.k === "bought" || e.k === "bought3")) g.log[0] = { k: "timeout", n: e.n, c: e.k === "bought3" ? e.c : 1 };
    if (uid === meId()) { ws = null; sel.clear(); toast(t("timeUp")); }
    commit(g);
  }
  function tick() {
    if (coverShowing()) clockStart = Date.now();   // the clock waits while the device is being passed
    const left = timeLeft();
    if (left === null) return;
    const sec = document.getElementById("sandSec"), bar = document.getElementById("sandBar"), box = document.getElementById("sand");
    if (sec) sec.textContent = Math.max(0, Math.ceil(left));
    if (bar) bar.style.width = Math.max(0, (left / game.timer) * 100) + "%";
    if (box) box.classList.toggle("low", left <= 10);
    if (left > 0 || timeoutFired === clockKey || busy || !canWrite) return;
    // The player's own device acts at zero; if they've left, anyone at the table does a few seconds later.
    if (isMyTurn() || ((mode === "local" || amInGame()) && left <= -6)) { timeoutFired = clockKey; timeoutDraw(); }
  }
  setInterval(tick, 250);
  function sandHtml() {
    const left = timeLeft();
    if (left === null) return "";
    const pct = Math.max(0, (left / game.timer) * 100);
    return `<div class="sand ${left <= 10 ? "low" : ""}" id="sand" role="timer" aria-label="${esc(t("sandTimer"))}">
      <svg class="${justFlipped ? "flip" : ""}" width="14" height="20" viewBox="0 0 14 20" aria-hidden="true"><path d="M1 1h12M1 19h12M2.5 1c0 6 9 5 9 9s-9 3-9 9M11.5 1c0 6-9 5-9 9s9 3 9 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span><b id="sandSec">${Math.max(0, Math.ceil(left))}</b>s</span>

  }
  function timerControl(current) {

  }

  function endGame() {
    const g = clone(game);
    g.status = "over"; g.winners = []; g.aborted = true; g.seq++;

    askEnd = false;
    commit(g);
  }
  function moveTo(target) {
    if (!ws || !sel.size) return;
    const ids = [...sel];
    const blocked = target === "hand" ? ids.filter((id) => !ws.orig.has(id)) : [];
    const moving = ids.filter((id) => !blocked.includes(id));
    ws.hand = ws.hand.filter((id) => !moving.includes(id));
    ws.table = ws.table.map((m) => m.filter((id) => !moving.includes(id)));
    if (target === "hand") ws.hand.push(...moving);
    else if (target === "new") ws.table.push(moving);
    else ws.table[target].push(...moving);
    ws.table = ws.table.filter((m) => m.length).map(sortMeld);
    sel.clear();
    if (blocked.length) toast(t("tableStays"));
    if (!game.touched && moving.some((id) => !ws.orig.has(id))) markTouched();
    render();
  }
  // House rule: once you move a card that was already on the table, giving up costs 3 cards.
  // Saved to the shared game so a reload doesn't clear it and everyone sees it.
  function markTouched() {
    game.touched = true;
    store.setGame(clone(game)).catch(() => {});
  }
  async function sit(nick) {
    nick = nick.trim().slice(0, 24);

    catch (e) { toast(t("saveFail")); }
  }
  async function unseat(id) { try { await store.delSeat(id); } catch (e) { toast(t("saveFail")); } }

  // ---------- sound & toast ----------
  function chime() {
    if (!audioOk) return;
    try {
      const ctx = chime.ctx || (chime.ctx = new (window.AudioContext || window.webkitAudioContext)());
      [660, 880].forEach((f, i) => {
        const o = ctx.createOscillator(), gn = ctx.createGain();
        o.frequency.value = f; o.type = "sine";
        gn.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.16);
        gn.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + i * 0.16 + 0.02);
        gn.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.16 + 0.35);
        o.connect(gn).connect(ctx.destination); o.start(ctx.currentTime + i * 0.16); o.stop(ctx.currentTime + i * 0.16 + 0.4);
      });
    } catch (e) {}
  }
  function toast(msg) {

  // ---------- render ----------

    return `<button class="${cls}" ${attrs} aria-label="${RL(r)}${SYM[s]}"><span class="ix">${RL(r)}<i>${SYM[s]}</i></span><span class="pip">${SYM[s]}</span></button>`;
  }
  // Screens follow the usual card-game flow: Home → Sala (seats & options) → Partida, with the

  // ----- Placar -----

  function tableHtml(mine) {

    const me = meId();

    const handIds = mine ? ws.hand : (game.hands[me] || []);
    const sorted = sortHand(handIds, sortMode);
    const backable = mine && [...sel].some((id) => ws.orig.has(id) && !ws.hand.includes(id));
    let hint = "", actions = "";
    if (mine && canWrite) {
      const st = wsStatus();
      hint = st.bad.length ? `<p class="hint warn">${t("hintFix")}</p>` : st.played > 0 && !st.countOk ? `<p class="hint warn">${t("hintLimit")}</p>` : st.ok ? `<p class="hint">${t("hintReady")}</p>` : st.changed ? `<p class="hint">${t("hintNeedPlay")}</p>` : `<p class="hint">${t("hintPick")}</p>`;
      if (game.touched && !st.ok) hint += `<p class="hint warn">${t("hintPenalty")}</p>`;
      actions = `<div class="actions">
        <button class="btn primary" data-act="confirm" ${st.ok && !busy ? "" : "disabled"}>${t("confirm")}</button>
        <button class="btn" data-act="undo" ${st.changed && !busy ? "" : "disabled"}>${t("undo")}</button>
        <button class="btn" data-act="draw" ${!st.changed && !busy ? "" : "disabled"} title="${st.changed ? esc(t("hintBuyUndo")) : ""}">${!game.deck.length ? t("pass") : game.touched ? t("buy3") : t("buy")}</button>
        ${backable ? `<button class="btn" data-act="drop" data-v="hand">${t("backToHand")}</button>` : ""}
      </div>`;
    } else if (game.status === "playing") {
      hint = `<p class="hint">${t(game.touched ? "mexendo" : "waiting", { n: game.players[game.turn].nick })}</p>`;
    }
    return `<section class="tray" aria-label="${esc(t("hand"))}">
      <div class="tray-head">
        <span class="label">${mode === "local" ? t("handOf", { n: nickOf(me) }) : t("hand")} · ${handIds.length}</span>
        <div class="seg" role="group" aria-label="${esc(t("sortLabel"))}">
          <button data-act="sort" data-v="suit" aria-pressed="${sortMode === "suit"}">${t("sortSuit")}</button>
          <button data-act="sort" data-v="rank" aria-pressed="${sortMode === "rank"}">${t("sortRank")}</button>
        </div>
      </div>
      <div class="hand ${backable ? "target" : ""}">${sorted.map((id) => cardHtml(id, { interactive: !!mine && !busy && canWrite })).join("")}</div>
      ${hint}${actions}
    </section>`;
  }
  function gameScreen() {
    const over = game.status === "over";
    const mine = !over && isMyTurn() && !!ws;
    const turnUid = game.players[game.turn].uid;
    const headline = over ? t("gameOver") : mine && (mode === "online" || humanCount() === 1) ? t("yourTurn") : t("turnOf", { n: nickOf(turnUid) });
    let h = `<div class="hud">
      <button class="iconbtn" data-act="modal" data-v="menu" aria-label="${esc(t("menu"))}">${ICON.menu}</button>

    </div>`;

  Object.assign(T.pt, {

  const RELAYS = ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt", "wss://test.mosquitto.org:8081"];
  const joinId = new URLSearchParams(location.search).get("mesa");
  const net = { role: joinId ? "guest" : "host", status: "connecting", peers: 0, hostId: joinId, hasState: false };
  const tableLink = () => location.origin + location.pathname + "?mesa=" + encodeURIComponent(net.hostId || "");
  const topicsFor = (id) => { const base = "mexe-mexe/v1/" + id; return { state: base + "/state", op: base + "/op", hb: base + "/hb" }; };
  const enc = (o) => JSON.stringify(o);
  const dec = (buf) => { try { return JSON.parse(buf.toString()); } catch (e) { return null; } };
  function connectRelay(url, opts, onConnect, onMessage, onDown) {
    // Heartbeats keep the line busy; a long keepalive avoids drops when a tab is slowed in the background.
    const c = window.mqtt.connect(url, { keepalive: 60, reconnectPeriod: 3000, connectTimeout: 10000, clean: true, clientId: "mm" + randId(), ...opts });
    c.on("connect", () => onConnect(c));
    c.on("message", (topic, payload) => onMessage(c, topic, payload));
    c.on("close", () => onDown(c));
    c.on("error", () => {});
    return c;
  }

  hooks.status = (compact) => {

    return `<p class="netpill ${cls}" role="status"><i aria-hidden="true"></i>${text}</p>${host && s === "open" && !compact ? `<p class="note">${t("netHostKeep")}</p>` : ""}`;
  };
  // Guests see a clear waiting screen until the table's state arrives, never an empty table.

  // ---------- heartbeat: who is at the table ----------
  // Every device says "I'm here" every 4 seconds on each relay. Anyone silent for 30 seconds
  // counts as gone; closing the page says goodbye right away. A small worker keeps the beat,
  // because browsers slow ordinary timers in background tabs, which made people look gone.
  // While our own connection is down we judge nobody, and on reconnect everyone gets that time back.
  const BEAT_MS = 4000, GONE_MS = 30000;
  function makeHeartbeat(topic, clients, base, onChange) {
    const lastSeen = new Map();
    let downSince = null, lastKey = null;
    const beat = (extra) => {
      const msg = enc({ id: myId, ...base, ...extra });
      clients.forEach((c) => { if (c.connected) c.publish(topic, msg, { qos: 0 }); });
    };
    const isFresh = (id) => lastSeen.has(id) && Date.now() - lastSeen.get(id) < GONE_MS;
    function evaluate() {
      const now = Date.now();
      if (![...clients].some((c) => c.connected)) { if (downSince === null) downSince = now; return; }
      if (downSince !== null) { const gap = now - downSince; lastSeen.forEach((v, k) => lastSeen.set(k, v + gap)); downSince = null; }
      const set = new Set([myId]);
      lastSeen.forEach((v, k) => { if (now - v < GONE_MS) set.add(k); });
      const key = [...set].sort().join(",");
      if (key !== lastKey) { lastKey = key; onChange(set); }
    }
    function heard(m) {
      if (!m || !m.id || m.id === myId) return;
      if (m.bye) lastSeen.delete(m.id); else lastSeen.set(m.id, Date.now());
      evaluate();
    }
    const tick = () => { beat(); evaluate(); };
    try {
      const worker = new Worker(URL.createObjectURL(new Blob([`setInterval(() => postMessage(0), ${BEAT_MS});`], { type: "text/javascript" })));
      worker.onmessage = tick;
    } catch (e) { setInterval(tick, BEAT_MS); }
    window.addEventListener("pagehide", () => beat({ bye: true }));
    return { beat, heard, evaluate, isFresh };
  }

  // Host: the normal on-device store; every change is published to the table's channel,
  // and guests' moves arrive as operations to apply.
  function makeHostStore() {
    const local = makeLocalStore();
    const snap = { game: null, lobby: [], settings: {}, stats: {}, hostUid: myId };
    let id = ls.get("mm-host-id");
    if (!id) { id = "mexe-" + randId().slice(1) + randId().slice(1); ls.set("mm-host-id", id); }
    net.hostId = id;
    const tp = topicsFor(id);
    const clients = new Set(), up = new Set();
    const seenOps = new Set();
    let rev = Date.now() * 1000, queued = false;
    const publishState = (c) => { if (c.connected) c.publish(tp.state, enc({ rev, data: snap }), { retain: true, qos: 1 }); };
    const broadcast = () => {
      if (queued) return;
      queued = true;
      setTimeout(() => { queued = false; rev++; clients.forEach(publishState); });
    };
    local.subGame((g) => { snap.game = g; broadcast(); });
    local.subLobby((l) => { snap.lobby = l; broadcast(); });
    local.subSettings((s) => { snap.settings = s; broadcast(); });
    local.subStats((s) => { snap.stats = s; broadcast(); });
    const OPS = ["setGame", "updateGame", "setSeat", "delSeat", "setSettings", "setStats"];
    const refresh = () => { net.status = up.size ? "open" : clients.size ? "reconnecting" : "connecting"; render(); };
    const hb = makeHeartbeat(tp.hb, clients, { host: true }, (set) => { net.peers = set.size - 1; presenceUpdate(set); });

    function apply(m) {
      if (!m || !OPS.includes(m.op) || !m.id || seenOps.has(m.id)) return;   // a move sent on several relays is applied once
      seenOps.add(m.id);
      if (seenOps.size > 500) seenOps.delete(seenOps.values().next().value);
      const args = m.args || [];
      // Ignore a late copy of an older game state so a slow relay can't undo a newer move.
      if (m.op === "setGame" && game && args[0] && args[0].id === game.id && args[0].seq < game.seq) return;
      Promise.resolve(local[m.op](...args)).catch(() => {});
    }
    if (!window.mqtt) return local;
    RELAYS.forEach((url) => {
      const c = connectRelay(url, {},
        (c) => { up.add(c); c.subscribe([tp.op, tp.hb], { qos: 0 }); publishState(c); hb.beat(); refresh(); keepAwake(); },
        (c, topic, payload) => { if (topic === tp.op) apply(dec(payload)); else if (topic === tp.hb) hb.heard(dec(payload)); },
        (c) => { up.delete(c); refresh(); });
      clients.add(c);
    });
    return local;
  }

  // Guest: mirrors the newest state seen on any relay and sends each move on all of them.
  function makeGuestStore(hostId) {
    const subs = { game: [], lobby: [], settings: [], stats: [] };
    const tp = topicsFor(hostId);
    const clients = new Set(), up = new Set();
    let data = null, rev = 0, opN = 0, hostUid = null, connectedAt = 0;
    const emit = (k) => subs[k].forEach((f) => f(data[k]));
    const hostAlive = () => !!hostUid && hb.isFresh(hostUid);
    const refresh = () => {
      if (!up.size) net.status = net.hasState ? "reconnecting" : "connecting";
      else if (hostAlive()) net.status = "open";
      else net.status = Date.now() - connectedAt > 10000 ? "hostAway" : "connecting";
      render();
    };
    const hb = makeHeartbeat(tp.hb, clients, {}, (set) => { if (data) presenceUpdate(set); refresh(); });
    function onState(m) {
      if (!m || !m.data || m.rev <= rev) return;
      // First contact: skip the home screen and go straight to the table to sit down.
      if (!net.hasState && m.data.game?.status !== "playing") screen = "lobby";
      rev = m.rev; data = m.data; net.hasState = true;
      if (data.hostUid) hostUid = data.hostUid;
      ["settings", "stats", "lobby", "game"].forEach(emit);
      refresh();
    }
    function send(op, args) {
      const live = [...up].filter((c) => c.connected);
      if (!live.length) return Promise.reject({ code: "unavailable" });
      const msg = enc({ op, args, id: myId + "-" + Date.now().toString(36) + "-" + (opN++) });
      live.forEach((c) => c.publish(tp.op, msg, { qos: 1 }));
      return Promise.resolve();
    }
    if (window.mqtt) RELAYS.forEach((url) => {
      const c = connectRelay(url, {},
        (c) => { if (!up.size) connectedAt = Date.now(); up.add(c); c.subscribe([tp.state, tp.hb], { qos: 0 }); hb.beat(); refresh(); },
        (c, topic, payload) => {
          if (topic === tp.state) onState(dec(payload));
          else if (topic === tp.hb) { const m = dec(payload); if (m && m.host) hostUid = m.id; hb.heard(m); refresh(); }
        },
        (c) => { up.delete(c); refresh(); });
      clients.add(c);
    });
    // If the table never answers, say so instead of spinning forever.
    setTimeout(refresh, 11000);
    const sub = (k) => (cb) => { subs[k].push(cb); if (data) setTimeout(() => cb(data[k])); return () => {}; };
    return {
      subGame: sub("game"), subLobby: sub("lobby"), subSettings: sub("settings"), subStats: sub("stats"),
      // Moves show up right away on this phone; the host's copy then confirms them for everyone.
      setGame(g) { if (data) { data.game = g; emit("game"); } return send("setGame", [g]); },
      updateGame(p) { if (data && data.game) { data.game = { ...data.game, ...p }; emit("game"); } return send("updateGame", [p]); },
      setSeat: (id, d) => send("setSeat", [id, d]),
      delSeat: (id) => send("delSeat", [id]),
      setSettings: (d) => send("setSettings", [d]),
      setStats: (d) => send("setStats", [d])
    };
  }

  // The host's screen must stay on, or the phone sleeps and the table closes.
  let wakeLock = null;
  async function keepAwake() {
    try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && net.role === "host") keepAwake(); });

  // ---------- boot ----------
  function localId() {
    let id = ls.get("mm-id");
    if (!id) { id = randId(); ls.set("mm-id", id); }
    return id;
  }
  function boot() {
    mode = "online";
    myId = localId();
    store = net.role === "host" ? makeHostStore() : makeGuestStore(joinId);
    store.subSettings((s) => { settings = s || {}; render(); });
    store.subStats((s) => { stats = s || {}; render(); });
    store.subLobby((l) => { lobby = (l || []).slice().sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0)); render(); });
    store.subGame((g) => onGame(g));
    render();
  }
  boot();
})();
</script>
